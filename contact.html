      <article class="contact active">

        <header>
          <h2 class="h2 article-title">Contact</h2>
        </header>

        <section class="mapbox" data-mapbox>
          <figure>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d233575.37519076854!2d90.37316593568768!3d23.83227737437733!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755cbddc54a229d%3A0xa1da2931fb97bca9!2sRupganj%20Upazila!5e0!3m2!1sen!2sbd!4v1784914964357!5m2!1sen!2sbd"
              width="400" height="300" loading="lazy" title="Map showing Rupganj, Narayanganj"></iframe>
          </figure>
        </section>

        <section class="contact-form">

          <h3 class="h3 form-title">Contact Form</h3>

          <form action="mailto:arifulislamfahim04@gmail.com" method="post" enctype="text/plain" class="form" data-form>

            <div class="input-wrapper">
              <div class="form-field">
                <label for="contact-fullname" class="form-label">Full name</label>
                <input type="text" id="contact-fullname" name="fullname" class="form-input" placeholder="Full name"
                  required data-form-input>
              </div>

              <div class="form-field">
                <label for="contact-email" class="form-label">Email address</label>
                <input type="email" id="contact-email" name="email" class="form-input" placeholder="Email address"
                  required data-form-input>
              </div>
            </div>

            <div class="form-field">
              <label for="contact-message" class="form-label">Your message</label>
              <textarea id="contact-message" name="message" class="form-input" placeholder="Your Message" required
                data-form-input></textarea>
            </div>

            <div class="form-consent">
              <input type="checkbox" id="form-consent" name="consent">
              <label for="form-consent">I consent to the processing of my personal data</label>
            </div>

            <button class="form-btn" type="submit" disabled data-form-btn>
              <ion-icon name="paper-plane" aria-hidden="true"></ion-icon>
              <span>Send Message</span>
            </button>

          </form>

        </section>
